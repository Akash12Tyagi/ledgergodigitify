name: CI

# Section 15/M8 hardening — the full test gate on every push/PR: lint,
# typecheck, unit/integration tests, and a production build. Tests are
# fully self-contained (vitest.setup.ts spins up its own in-memory Mongo
# replica set and placeholder env vars — Section 2.4), so this job needs
# no external services or secrets. The build step needs syntactically
# valid (not real) env vars only, since config/env.ts validates format at
# import time but nothing here calls the database at build time (every
# route is `force-dynamic`, Section 9).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/finance-ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-ci-placeholder-32c
      BETTER_AUTH_URL: http://localhost:3000
      CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
      CRON_SECRET: ci-placeholder-cron-secret-ci-placeholder
      APP_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=10

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
